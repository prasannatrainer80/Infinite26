<p>add-employ works!</p>
<form #employForm="ngForm" (ngSubmit)="addEmploy(employForm)">
    Employ Name : 
   <input type="text" name="name" required
    [(ngModel)]="employ.name" #name="ngModel" /> <br/><br/>
    
    Gender : 
    <input type="text" name="gender" required
    [(ngModel)]="employ.gender" #gender="ngModel" /> <br/><br/>
    
    Email : 
    <input type="text" name="email" required
    [(ngModel)]="employ.email" #email="ngModel" /> <br/><br/>
    
    Password : 
    <input type="password" name="password" required
    [(ngModel)]="employ.password" #password="ngModel" /> <br/><br/>
   
    Roles : 
    <input type="text" name="roles" required
    [(ngModel)]="employ.roles" #roles="ngModel" /> <br/><br/>
    <input type="submit" value="Add" />
</form>
